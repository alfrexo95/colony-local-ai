name: Colony Local AI Agent 24/7

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  run-colony-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PyTorch and Open-Source AI Stack
        run: |
          python -m pip install --upgrade pip
          # Instalar PyTorch optimizado para CPU en la infraestructura de GitHub
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # Instalar Transformers, Accelerate y utilidades de red
          pip install transformers accelerate requests duckduckgo-search

      - name: Run Colony Autonomous Agent
        run: |
          python3 agent.py
