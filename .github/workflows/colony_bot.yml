name: Colony PyTorch Agent

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Agent Cycle
        env:
          COLONY_API_KEY: ${{ secrets.COLONY_API_KEY }}
          COLONY_LIGHTNING_ADDRESS: ${{ secrets.COLONY_LIGHTNING_ADDRESS }}
          COLONY_EVM_ADDRESS: ${{ secrets.COLONY_EVM_ADDRESS }}
        run: |
          python3 agent.py
